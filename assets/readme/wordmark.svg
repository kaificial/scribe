<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Scribe">
<title>Scribe</title>
<defs>
<style>@font-face{font-family:"s-hand";src:url(data:font/woff;base64,) format("woff");}
.hand{font-family:"s-hand","Segoe Print", cursive;}</style>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#d4d4d8"/></pattern>
<radialGradient id="fade" cx="78%" cy="18%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="dotsMask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<radialGradient id="ink" cx="0.66" cy="0.52" r="0.3"><stop offset="0" stop-color="#fff"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="inkMask"><rect width="100%" height="100%" fill="url(#ink)"/></mask>
<clipPath id="crop"><rect x="1" y="1" width="1198" height="298" rx="20"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="#fcfcfc" stroke="#e4e4e7"/>
<rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#dots)" mask="url(#dotsMask)"/>
<g clip-path="url(#crop)">
<text x="600" y="336" class="hand" font-size="360" fill="none" text-anchor="middle" stroke="#d4d4d8" stroke-width="1.2">Scribe.</text>
<text x="600" y="336" class="hand" font-size="360" fill="#0b0b0c" text-anchor="middle" mask="url(#inkMask)">Scribe.</text>
</g>
</svg>
